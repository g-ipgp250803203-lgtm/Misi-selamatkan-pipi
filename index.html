<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papa Zola: Selamatkan Pipi!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:#fffaf0;--ink:#2b2350;--sub:#6a5f8f;--ok:#1f9d55;--bad:#d64545;--acc:#ff9f1c;--acc2:#5b3df5;--bg:#1b1640;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a2459;--ink:#fff7e6;--sub:#c9c1f0;--bg:#100c2b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:#fff}
h1{font-size:clamp(1.1rem,3.4vw,1.6rem);margin:0;font-weight:800;letter-spacing:.3px}
.tools{display:flex;gap:8px;align-items:center}
.dots{display:flex;gap:8px}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:transparent;color:#fff;font:700 1rem inherit;font-family:inherit;cursor:pointer}
.dot.on{background:var(--acc);border-color:var(--acc);color:#2b2350}
.iconbtn{width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:1.1rem}
main{width:100%;max-width:960px;padding:0 12px 16px;flex:1}
.stage{position:relative;width:100%;aspect-ratio:16/9;perspective:900px;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.world{position:absolute;inset:-4%;transform-style:preserve-3d;transition:transform .15s ease-out}
.layer{position:absolute;inset:0;width:100%;height:100%}
.caption{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);color:#2b2350;border-radius:14px;padding:4px 12px;font-weight:700;font-size:clamp(.75rem,2.2vw,1rem);transform:translateZ(120px)}
.panel{margin-top:14px;background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.3);text-align:center}
.hint{margin:0 0 6px;color:var(--sub);font-weight:500}
.sentence{font-size:clamp(1.3rem,4.4vw,2.2rem);font-weight:800;line-height:1.3;margin:4px auto 12px;max-width:760px}
.sentence span{display:inline-block;margin:0 4px;padding:0 4px;border-radius:8px;transition:background .3s}
.sentence .g{background:#c8f3d6;color:#0c5a2e}.sentence .r{background:#ffd3d3;color:#8d1d1d}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
button.big{font:800 1.1rem inherit;font-family:inherit;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.big:disabled{opacity:.4;cursor:not-allowed}
button.big:focus-visible,.dot:focus-visible,.iconbtn:focus-visible{outline:4px solid #fff;outline-offset:2px}
.listen{background:#3b82f6}.next{background:var(--ok)}.prev{background:#8b7fc7}
#mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:2rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28);position:relative}
#mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.7),0 6px 0 rgba(0,0,0,.28)}100%{box-shadow:0 0 0 24px rgba(214,69,69,0),0 6px 0 rgba(0,0,0,.28)}}
.wave{display:none;gap:4px;height:34px;align-items:center}
.wave.show{display:flex}
.wave i{width:6px;background:var(--acc2);border-radius:3px;animation:bar .7s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes bar{0%,100%{height:8px}50%{height:32px}}
.result{min-height:2.6em;margin-top:12px;font-size:clamp(1.1rem,3.4vw,1.6rem);font-weight:800}
.result.ok{color:var(--ok);animation:pop .5s}.result.bad{color:var(--bad)}
.heard{font-weight:500;color:var(--sub);font-size:.95rem;margin-top:2px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.typed{margin-top:10px;font-size:.9rem;color:var(--sub)}
.typed input{font:inherit;padding:6px 12px;border-radius:999px;border:2px solid var(--sub);background:transparent;color:var(--ink);width:min(320px,70%)}
.typed button{font:inherit;border:0;border-radius:999px;padding:6px 14px;background:var(--acc2);color:#fff;cursor:pointer}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:50;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.end{display:none;position:absolute;inset:0;background:rgba(27,22,64,.82);color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;transform:translateZ(200px);z-index:5}
.end.show{display:flex}.end h2{font-size:clamp(1.5rem,5vw,2.6rem);margin:0 0 6px}
/* animations in scenes */
.cloud{animation:drift 40s linear infinite}.cloud.b{animation-duration:60s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(900px)}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.wave-hand{transform-origin:0 0;animation:hand .6s ease-in-out infinite alternate}
@keyframes hand{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
.bob{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.legA{transform-origin:0 0;animation:legA .35s ease-in-out infinite alternate}
.legB{transform-origin:0 0;animation:legA .35s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
.run{animation:runX 6s ease-in-out infinite alternate}
@keyframes runX{from{transform:translateX(0)}to{transform:translateX(150px)}}
.dust{animation:dust .6s linear infinite}
@keyframes dust{from{opacity:.8;transform:translateX(0) scale(.6)}to{opacity:0;transform:translateX(-50px) scale(1.4)}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header>
  <h1>Papa Zola: Selamatkan Pipi!</h1>
  <div class="tools">
    <div class="dots" id="dots"></div>
    <button class="iconbtn" id="mute" aria-label="Bunyi" title="Bunyi hidup/mati">🔊</button>
  </div>
</header>
<main>
  <div class="stage" id="stage"><div class="world" id="world"></div>
    <div class="end" id="end"><h2>🏆 Hebat! Kamu berjaya!</h2><p>Kamu telah menyelamatkan Pipi dengan sebutan yang jelas.</p><button class="big next" id="again">Main semula</button></div>
  </div>
  <section class="panel">
    <p class="hint" id="hint">Baca ayat ini dengan kuat:</p>
    <div class="sentence" id="sentence"></div>
    <div class="row">
      
      <button id="mic" aria-label="Tekan dan sebut ayat">🎤</button>
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="heard" id="heard"></div>
    <div class="row" style="margin-top:12px">
      <button class="big prev" id="prev">◀ Kembali</button>
      <button class="big next" id="next" disabled>Seterusnya ▶</button>
    </div>
  </section>
</main>
<script>
const SCENES=[
 {cap:"Situasi 1",text:"Pipi berada di dalam makmal di belakang bukit.",say:"Pipi berada di dalam makmal di belakang bukit"},
 {cap:"Situasi 2",text:"Papa Zola berlari ke arah bukit untuk menyelamatkan Pipi.",say:"Papa Zola berlari ke arah bukit untuk menyelamatkan Pipi"}
];
let cur=0,done=[false,false],muted=false,ac=null;
const $=id=>document.getElementById(id);

/* ---------- Sound effects (WebAudio) ---------- */
function tone(f,t0,d,type="sine",v=.15,f2){
  if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime+t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+t0+d);
  g.gain.setValueAtTime(v,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t0+d);
  o.connect(g).connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.05);}catch(e){}
}
const SFX={
 click:()=>tone(660,0,.08,"square",.08),
 start:()=>{tone(440,0,.1,"triangle");tone(660,.1,.15,"triangle")},
 whoosh:()=>tone(900,0,.5,"sawtooth",.05,120),
 ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,"triangle",.18)),
 bad:()=>{tone(220,0,.2,"sawtooth",.1);tone(165,.18,.3,"sawtooth",.1)},
 win:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.35,"triangle",.18))
};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";if(!muted)SFX.click()};

/* ---------- 3D scene art (layered SVG with translateZ) ---------- */
const L=(z,inner,extra="")=>`<svg class="layer" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" style="transform:translateZ(${z}px) scale(${1+(-z/900)});${extra}">${inner}</svg>`;
const clouds=`<g fill="#fff" opacity=".9"><g class="cloud"><ellipse cx="100" cy="70" rx="50" ry="20"/><ellipse cx="135" cy="58" rx="35" ry="20"/><ellipse cx="70" cy="62" rx="30" ry="16"/></g><g class="cloud b"><ellipse cx="300" cy="110" rx="60" ry="22"/><ellipse cx="340" cy="96" rx="38" ry="22"/></g></g>`;
function sky(s2){return L(-300,`<defs><linearGradient id="sk${s2}" x1="0" y1="0" x2="0" y2="1">${s2?'<stop offset="0" stop-color="#ff7a59"/><stop offset=".6" stop-color="#ffc46b"/><stop offset="1" stop-color="#ffe9a8"/>':'<stop offset="0" stop-color="#4aa8ff"/><stop offset=".7" stop-color="#a6e0ff"/><stop offset="1" stop-color="#e6f8ff"/>'}</linearGradient></defs><rect width="800" height="450" fill="url(#sk${s2})"/><circle cx="650" cy="${s2?150:90}" r="${s2?52:40}" fill="${s2?'#fff3b0':'#ffe066'}"/>${clouds}`)}
const farHills=L(-200,`<path d="M0 300 Q120 190 260 290 T520 270 T800 300 V450 H0Z" fill="#6cc4a1"/><path d="M0 340 Q200 250 380 330 T800 320 V450 H0Z" fill="#4eb08a"/>`);
function lab(s2,pipi){const x=s2?95:520,y=s2?195:175,sc=s2?.6:1;
 return L(-110,`<g transform="translate(${x} ${y}) scale(${sc})">
  <rect x="0" y="40" width="220" height="150" rx="10" fill="#d8dcf0"/><rect x="0" y="40" width="220" height="150" rx="10" fill="none" stroke="#8f95c4" stroke-width="4"/>
  <path d="M30 40 A80 70 0 0 1 190 40Z" fill="#9aa4e8"/><path d="M60 38 A50 40 0 0 1 120 12" stroke="#fff" stroke-width="6" fill="none" opacity=".6"/>
  <rect x="108" y="-30" width="4" height="40" fill="#555"/><circle cx="110" cy="-34" r="7" fill="#ff3b3b" class="blink"/>
  <rect x="25" y="70" width="80" height="60" rx="8" fill="#ffe28a" class="glow"/><rect x="25" y="70" width="80" height="60" rx="8" fill="none" stroke="#6b6fa8" stroke-width="5"/>
  ${pipi?`<g transform="translate(65 118)"><circle r="19" fill="#ffd2a8"/><path d="M-20 -6 Q0 -34 20 -6 Q8 -14 -20 -6Z" fill="#ff7a1a"/><circle cx="-7" cy="-2" r="2.6" fill="#222"/><circle cx="7" cy="-2" r="2.6" fill="#222"/><path d="M-6 7 Q0 12 6 7" stroke="#b33" stroke-width="2" fill="none"/><g transform="translate(18 10)"><rect class="wave-hand" x="0" y="-26" width="7" height="26" rx="3" fill="#ffd2a8"/></g></g>`:''}
  <rect x="140" y="95" width="55" height="95" rx="6" fill="#7a6ad8"/><circle cx="185" cy="145" r="4" fill="#ffe066"/>
  <text x="112" y="62" text-anchor="middle" font-size="16" font-weight="800" fill="#4a4f88" font-family="sans-serif">MAKMAL</text>
  <g opacity=".85"><circle cx="40" cy="30" r="6" fill="#7dffb2" class="glow"/><circle cx="170" cy="30" r="5" fill="#ff9bf0" class="glow"/></g></g>`)}
function hill(s2){const k=s2?"M-20 450 V270 Q80 150 330 215 Q520 150 820 300 V450Z":"M-20 450 V250 Q220 120 500 200 Q700 160 820 290 V450Z";
 return L(-20,`<defs><linearGradient id="hg${s2}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58c46a"/><stop offset="1" stop-color="#2f8f4e"/></linearGradient></defs><path d="${k}" fill="url(#hg${s2})"/><path d="${k}" fill="none" stroke="#9cf0a8" stroke-width="3" opacity=".6"/><path d="M-20 450 Q300 330 800 420 V450Z" fill="#8a6a42"/>${s2?'<ellipse cx="330" cy="215" rx="0" ry="0"/>':''}`)}
const trees=`<g class="sway"><rect x="86" y="300" width="10" height="40" fill="#7a4b24"/><circle cx="91" cy="290" r="28" fill="#2f8f4e"/><circle cx="74" cy="305" r="20" fill="#3aa65c"/></g>`;
function fore(){return L(50,`<g>${trees}<g transform="translate(640 390)"><rect x="-2" y="0" width="4" height="40" fill="#2f8f4e"/><circle cy="-4" r="12" fill="#ff5d8f"/><circle cy="-4" r="5" fill="#ffe066"/></g><g transform="translate(700 410)"><rect x="-2" y="0" width="4" height="30" fill="#2f8f4e"/><circle cy="-4" r="10" fill="#ffd23f"/><circle cy="-4" r="4" fill="#ff9f1c"/></g></g>`)}
function papa(){return L(90,`<g transform="translate(120 250)"><g class="run"><g class="bob">
  <ellipse cx="22" cy="132" rx="38" ry="8" fill="rgba(0,0,0,.25)"/>
  <g transform="translate(20 92)"><rect class="legA" x="-6" y="0" width="12" height="38" rx="6" fill="#33406b"/></g>
  <g transform="translate(34 92)"><rect class="legB" x="-6" y="0" width="12" height="38" rx="6" fill="#33406b"/></g>
  <rect x="2" y="42" width="52" height="58" rx="18" fill="#2fa86b"/>
  <g transform="translate(6 52)"><rect class="legB" x="-5" y="0" width="10" height="34" rx="5" fill="#f1c093"/></g>
  <g transform="translate(50 52)"><rect class="legA" x="-5" y="0" width="10" height="34" rx="5" fill="#f1c093"/></g>
  <circle cx="28" cy="26" r="26" fill="#f1c093"/>
  <path d="M2 20 Q10 -6 30 -2 Q52 -4 54 20 Q40 6 2 20Z" fill="#3b2a20"/>
  <circle cx="38" cy="24" r="3" fill="#222"/><circle cx="20" cy="24" r="3" fill="#222"/>
  <path d="M14 40 Q28 34 42 40 Q28 48 14 40Z" fill="#3b2a20"/>
  <path d="M24 33 Q31 38 38 33" stroke="#a33" stroke-width="2" fill="none"/>
  <g transform="translate(-6 8)"><ellipse cx="-12" cy="20" rx="0" ry="0"/></g>
 </g><g class="dust"><circle cx="-8" cy="128" r="9" fill="#e9d3a8"/></g><g class="dust" style="animation-delay:.3s"><circle cx="-8" cy="124" r="7" fill="#e9d3a8"/></g></g>
 <g transform="translate(180 -10)"><rect x="0" y="0" width="120" height="44" rx="16" fill="#fff"/><path d="M10 40 L0 62 L34 42Z" fill="#fff"/><text x="60" y="30" text-anchor="middle" font-size="22" font-weight="800" fill="#d64545" font-family="sans-serif">Pipi!</text></g></g>`)}
function build(i){
 const s2=i===1;
 $("world").innerHTML=sky(i)+farHills+lab(s2,!s2)+hill(s2)+fore()+(s2?papa():"")+`<div class="caption">${SCENES[i].cap}</div>`;
}

/* ---------- UI ---------- */
function render(){
 build(cur);
 $("sentence").innerHTML=SCENES[cur].text.split(" ").map(w=>`<span>${w}</span>`).join(" ");
 $("result").textContent="";$("result").className="result";$("heard").textContent="";
 $("next").disabled=!done[cur];$("prev").disabled=cur===0;
 $("next").textContent=cur===SCENES.length-1?"Selesai ★":"Seterusnya ▶";
 $("hint").textContent="Baca ayat ini dengan kuat:";
 [...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===cur));
}
SCENES.forEach((_,i)=>{const b=document.createElement("button");b.className="dot";b.textContent=i+1;b.setAttribute("aria-label","Situasi "+(i+1));
 b.onclick=()=>{if(i<=cur||done[i-1]){go(i)}else{SFX.bad();$("hint").textContent="Siapkan situasi sebelum ini dahulu."}};$("dots").appendChild(b)});
function go(i){SFX.whoosh();cur=i;render()}
$("prev").onclick=()=>{if(cur>0)go(cur-1)};
$("next").onclick=()=>{SFX.click();if(cur<SCENES.length-1)go(cur+1);else{SFX.win();$("end").classList.add("show");confetti(60)}};
$("again").onclick=()=>{$("end").classList.remove("show");done=[false,false];go(0)};
$("stage").addEventListener("pointermove",e=>{const r=$("stage").getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 $("world").style.transform=`rotateY(${x*10}deg) rotateX(${-y*8}deg)`});
$("stage").addEventListener("pointerleave",()=>$("world").style.transform="");

/* ---------- Speaking / checking ---------- */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function check(alts){
 const target=norm(SCENES[cur].say);let best="",score=0;
 alts.forEach(t=>{const s=sim(norm(t),target);if(s>=score){score=s;best=t}});
 const heardWords=norm(best).split(" ");
 [...$("sentence").children].forEach((sp,i)=>{const w=norm(sp.textContent);sp.className=heardWords.includes(w)?"g":"r"});
 $("heard").textContent=best?`Saya dengar: “${best}”`:"";
 const r=$("result");
 if(score>=.82){r.className="result ok";r.textContent="🎉 Tahniah jawapan anda tepat";SFX.ok();confetti(40);done[cur]=true;$("next").disabled=false}
 else{r.className="result bad";r.textContent="Cuba lagi! Perkataan merah perlu disebut dengan jelas.";SFX.bad()}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function stopUI(){listening=false;$("mic").classList.remove("rec");$("wave").classList.remove("show")}
$("mic").onclick=()=>{
 if(!SR){$("result").className="result bad";$("result").textContent="Pelayar ini tidak menyokong rakaman suara. Gunakan Chrome atau Edge.";SFX.bad();return}
 if(listening){rec&&rec.stop();return}
 rec=new SR();rec.lang="ms-MY";rec.interimResults=false;rec.maxAlternatives=5;
 rec.onstart=()=>{listening=true;$("mic").classList.add("rec");$("wave").classList.add("show");$("result").className="result";$("result").textContent="Sedang mendengar… sila sebut ayat.";SFX.start()};
 rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);check(alts)};
 rec.onerror=e=>{stopUI();$("result").className="result bad";
  $("result").textContent=e.error==="not-allowed"||e.error==="service-not-allowed"?"Mikrofon disekat. Klik ikon mikrofon/mangga di bar alamat dan pilih Allow. Jika masih gagal, buka fail HTML terus dalam Chrome.":e.error==="no-speech"?"Tiada suara didengar. Cuba lagi.":"Ralat rakaman: "+e.error;SFX.bad()};
 rec.onend=stopUI;
 try{rec.start()}catch(e){}
};
function confetti(n){const c=["#ff9f1c","#5b3df5","#1f9d55","#ff5d8f","#3b82f6","#ffd23f"];
 for(let i=0;i<n;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=c[i%c.length];d.style.animationDelay=Math.random()*.6+"s";d.style.animationDuration=1.8+Math.random()*1.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}
render();
</script>
</body>
</html>
